name: Collect Steam CCU

# 每小时采集永劫无间的同时在线人数，写入独立的 data 分支。
#
# 为什么单独开 data 分支：
#   数据每小时提交一次，放在 main 会污染历史，并让 dev/main 在数据文件上持续分叉。
#   改到 data 分支后，main 只承载代码，数据随时更新且永不冲突。
#
# 页面侧读取：
#   https://raw.githubusercontent.com/aggressive0/My-web/data/steam-ccu.json
#   该域名返回 Access-Control-Allow-Origin: *，可跨域直接 fetch。
#
# 这里不再发布 Pages：数据不在站点目录里，站点无需重新构建。
# Runner 在境外可直连 api.steampowered.com，不需要代理。

on:
  schedule:
    # cron 是 UTC，GitHub 高峰期会延迟几分钟到十几分钟，属正常现象
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write      # 写 data 分支

concurrency:
  group: collect-ccu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Collect and publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEAM_APPID: '1203220'
          WINDOW_HOURS: '72'
        run: python3 backend/collectors/ci_publish.py
