name: Collect Steam Reviews

# 每两小时采集一轮评论（backend/config/games.yaml 里所有启用游戏），
# 聚合后写入独立的 data 分支。
#
# 与其他采集任务的区别：
#   CCU 任务每小时写 steam-ccu.json；本任务写 reviews-daily.json 等三个文件。
#   两者共用同一个 data 分支但互不覆盖，因此 concurrency group 必须分开，
#   否则会把对方的运行挤掉（cancel-in-progress: false 只会排队，不会覆盖，
#   但排队会让评论采集被 CCU 任务拖到很晚）。
#
# 为什么每两小时而不是每小时：
#   filter=recent 每页固定 5 条、每页 100 条只在 filter=all 时生效，
#   实测同一款游戏两小时内新增评论量级在几十条。两小时一轮已足够连续，
#   再密只是重复拉同一批 id（去重后 0 新增）。

on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略已有聚合与去重集合，按本次抓取重算（口径修正用）'
        type: choice
        options: ['0', '1']
        default: '0'

permissions:
  contents: write      # 写 data 分支

concurrency:
  group: collect-reviews
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Collect and publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_REBUILD: ${{ inputs.rebuild || '0' }}
        run: python3 backend/collectors/reviews_publish.py
