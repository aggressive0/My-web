name: Smoke test (static site)

# 冒烟测试只回答一个问题：四个页面还能不能正常用。
# 它不判业务数值对错，也不做视觉像素比对 —— 那是另外两层的事。
# 关键：PR 上必须跑，否则这个仓库会再次出现「部署成功、页面报错」的情况。

on:
  pull_request:
    paths-ignore:
      - 'front/static_html/json/steam-ccu.json'
  push:
    branches: [main, dev]
    paths-ignore:
      # 每小时的数据提交不跑冒烟（deploy.yml 仍会正常触发）
      - 'front/static_html/json/steam-ccu.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test deps
        working-directory: tests
        run: npm ci

      - name: Install Chromium (headless shell)
        working-directory: tests
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run smoke test
        # 已知基础设施工况：Node 24 的 undici 在本地 http.server 提前关闭连接时
        # 会抛 assert(!this.paused) 并直接终止进程（约 1/5 概率，19-24s 处）。
        # 这不是断言失败，也不是页面问题，但会让 PR 卡在 UNSTABLE。
        # 策略：失败后重跑一次；真实失败会连续失败两次，结论不变。
        run: |
          set +e
          node tests/smoke.mjs
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::冒烟首次失败（exit=$code），重跑一次以排除 undici 已知崩溃"
            node tests/smoke.mjs
            code=$?
          fi
          exit $code

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-artifacts
          path: tests/artifacts
          if-no-files-found: ignore
          retention-days: 7

  # 后端测试：配置校验、schema 幂等、失败隔离、API 契约、评论聚合。
  # 与冒烟分开成一个 job，是为了并行跑（前端 ~1.5min，后端 ~40s），
  # 且失败原因一眼能分清是「页面坏了」还是「数据层坏了」。
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run unittest
        run: python -m unittest discover -s tests -p "test_*.py" -v
