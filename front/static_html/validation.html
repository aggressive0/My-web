<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>留存追踪 · NEXUS 玩家留存中枢</title>

<link rel="stylesheet" href="live-ticker.css">

<script src="js/dashboard-data.js"></script>

<style>
:root{
    --bg:#05090F;
    --ink:#EAF3FF;
    --ink-2:#9EB1CA;
    --ink-3:#637A96;
    --line:rgba(90,140,200,.18);
    --line-soft:rgba(90,140,200,.10);
    --cyan:#35D9F2;
    --blue:#318BFF;
    --violet:#9275FF;
    --amber:#FFB45F;
    --green:#35D399;
    --red:#FF6B75;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(900px 420px at 50% -12%, rgba(49,139,255,.14), transparent 72%),
        radial-gradient(700px 380px at 86% 8%, rgba(146,117,255,.08), transparent 74%),
        var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:13px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
}

.page{
    flex:1;
    min-height:0;
    width:100%;
    max-width:1420px;
    margin:0 auto;
    padding:14px clamp(12px,1.8vw,24px) 10px;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) minmax(0,.86fr) auto;
    gap:12px;
}

/* ---------- 通用面板 ---------- */
.panel{
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:0;
    border-radius:13px;
    background:linear-gradient(180deg, rgba(13,24,41,.9), rgba(6,12,22,.94));
    border:1px solid var(--line);
    box-shadow:0 26px 56px -40px #000, inset 0 1px 0 rgba(255,255,255,.035);
    overflow:hidden;
}
.panel::before{
    content:"";
    position:absolute;
    top:0; left:10%; right:10%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(53,217,242,.5), rgba(146,117,255,.32), transparent);
    opacity:.8;
}
.p-head{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px 0;
}
.p-title{
    display:flex;
    align-items:center;
    gap:7px;
    margin:0;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--ink);
    white-space:nowrap;
}
.p-title::before{
    content:"";
    width:3px;height:12px;
    border-radius:2px;
    background:var(--accent,var(--cyan));
    box-shadow:0 0 10px var(--accent,var(--cyan));
}
.p-tag{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.14em;
    color:var(--ink-3);
    white-space:nowrap;
}
.p-body{position:relative;flex:1;min-height:0}

/* ---------- KPI ---------- */
.kpi-row{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
}
.kpi{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    border-radius:13px;
    border:1px solid var(--line);
    background:linear-gradient(158deg, rgba(18,32,54,.92), rgba(7,13,24,.94));
    box-shadow:0 24px 48px -36px #000, inset 0 1px 0 rgba(255,255,255,.045);
    overflow:hidden;
}
.kpi-ico{
    flex:none;
    width:38px;height:38px;
    display:grid;
    place-items:center;
    border-radius:11px;
    color:var(--c);
    background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid var(--edge);
    box-shadow:0 0 22px -6px var(--glow), inset 0 1px 0 rgba(255,255,255,.12);
}
.kpi-ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kpi-main{min-width:0;padding-right:70px}
.kpi-label{display:block;font-size:10.5px;letter-spacing:.13em;color:var(--ink-3);white-space:nowrap}
.kpi-num{
    display:flex;align-items:baseline;gap:3px;
    margin-top:2px;
    font-family:var(--mono);
    font-size:22px;font-weight:600;line-height:1.15;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    white-space:nowrap;
}
.kpi-num .u{font-size:13px;font-weight:500;color:var(--ink-2)}
.kpi-delta{flex:none;margin-left:5px;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--green)}
.kpi-delta.is-bad{color:var(--red)}
.kpi-spark{position:absolute;right:8px;bottom:8px;width:66px;height:28px;pointer-events:none;opacity:.85}

/* ---------- 中部两栏 ---------- */
.mid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:12px;min-height:0}

/* 分段控件 */
.seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:8px;background:rgba(90,140,200,.08);border:1px solid rgba(90,140,200,.16)}
.seg button{
    padding:2px 9px;border:0;border-radius:6px;background:none;
    color:var(--ink-3);font-family:var(--sans);font-size:10.5px;line-height:1.6;cursor:pointer;
    transition:color .16s ease, background-color .16s ease;
}
.seg button:hover{color:var(--ink-2)}
.seg button.is-on{
    color:#04202B;font-weight:600;
    background:linear-gradient(180deg,var(--cyan),#1FB6CF);
    box-shadow:0 0 14px -4px rgba(53,217,242,.8);
}
.seg button:focus-visible{outline:1px solid var(--cyan);outline-offset:1px}

/* ---------- cohort 表 ---------- */
.cohort{
    display:flex;flex-direction:column;
    padding:8px 12px 12px;
    height:100%;min-height:0;
}
.cohort-row{
    display:grid;
    grid-template-columns:minmax(0,1.32fr) repeat(5,minmax(0,1fr));
    gap:6px;
    align-items:center;
}
.cohort-head{padding-bottom:6px;border-bottom:1px solid rgba(90,140,200,.14)}
.cohort-head span{
    font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);text-align:center;
}
.cohort-head span:first-child{text-align:left}
.cohort-body{display:flex;flex-direction:column;justify-content:space-between;gap:5px;margin-top:7px;flex:1;min-height:0}
.cohort-cell{
    display:grid;place-items:center;
    height:100%;
    min-height:26px;
    border-radius:5px;
    font-family:var(--mono);
    font-size:11px;
    font-variant-numeric:tabular-nums;
    color:#DCEBFF;
}
.cohort-period{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-2);
    white-space:nowrap;
}

/* ---------- 分群留存 ---------- */
.seg-rows{
    display:flex;flex-direction:column;justify-content:space-around;
    gap:2px;padding:6px 14px 12px;height:100%;
}
.seg-row{display:grid;grid-template-columns:20px minmax(0,88px) minmax(0,1fr) 52px;align-items:center;gap:9px;font-size:11.5px}
.seg-ico{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;color:var(--c);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.seg-ico svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg-name{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-track{position:relative;height:9px;border-radius:5px;background:rgba(90,140,200,.10);overflow:hidden}
.seg-fill{
    position:absolute;inset:0 auto 0 0;border-radius:5px;
    background:var(--c);
    box-shadow:0 0 12px var(--c);
    transform-origin:left center;
    animation:grow .9s cubic-bezier(.22,.61,.36,1) both;
}
.seg-fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(0,0,0,.12))}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.seg-val{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;font-family:var(--mono);font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.seg-val em{font-style:normal;font-size:9.5px;color:var(--green)}
.seg-val em.is-bad{color:var(--red)}

/* ---------- 关键因素 ---------- */
.factor-wrap{display:grid;grid-template-columns:minmax(0,1fr);padding:2px 12px 10px;height:100%;min-height:0}
#factorChart{min-height:120px}
.factor-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:0 2px 2px}
.factor-item{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-2)}
.factor-dot{width:7px;height:7px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.factor-item .v{font-family:var(--mono);font-size:10.5px;color:var(--ink)}

/* ---------- AI 洞察 ---------- */
.insight-wrap{display:flex;flex-direction:column;gap:8px;padding:8px 13px 12px;height:100%;min-height:0}
.insight{
    display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px;
    padding:8px 9px;border-radius:9px;
    background:rgba(90,140,200,.05);
    border:1px solid rgba(90,140,200,.1);
}
.insight-ico{
    display:grid;place-items:center;width:26px;height:26px;border-radius:8px;
    color:var(--ic);
    background:rgba(255,255,255,.04);
    border:1px solid color-mix(in srgb, var(--ic) 40%, transparent);
}
.insight-ico svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.insight b{display:block;font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.4}
.insight span{display:block;margin-top:1px;font-size:10px;line-height:1.5;color:var(--ink-3)}
.insight-act{margin-top:3px;font-size:10px;color:var(--cyan)}
.insight-cta{
    margin-top:auto;
    display:flex;align-items:center;justify-content:center;gap:6px;
    height:30px;border-radius:8px;
    border:1px solid rgba(53,217,242,.4);
    background:linear-gradient(180deg, rgba(53,217,242,.2), rgba(53,217,242,.06));
    color:#DFF9FF;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.04em;
    cursor:pointer;transition:background-color .18s ease, box-shadow .18s ease;
}
.insight-cta:hover{box-shadow:0 0 20px -6px rgba(53,217,242,.9);background:linear-gradient(180deg, rgba(53,217,242,.3), rgba(53,217,242,.1))}
.badge{
    padding:1px 7px;border-radius:5px;font-size:9.5px;letter-spacing:.06em;
    color:var(--bc);background:rgba(255,255,255,.04);border:1px solid var(--bc);
    white-space:nowrap;
}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
    .page{grid-template-rows:auto auto auto auto}
    .mid{grid-template-columns:minmax(0,1fr)}
    .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
    .bottom-row{grid-template-columns:minmax(0,1fr) !important}
    .cohort{min-height:250px}
}
@media (max-width:760px){
    .kpi-row{grid-template-columns:minmax(0,1fr)}
    .kpi-main{padding-right:64px}
    .page{padding:10px 10px 8px}
}
@media (prefers-reduced-motion:reduce){
    .seg-fill{animation:none}
}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
</style>
</head>

        crown: '<path d="M3 17.5V8l4.6 3.4L12 5l4.4 6.4L21 8v9.5z"/><path d="M3 20.4h18"/>',
        clock: '<circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/>',
        gem: '<path d="M12 3.4l7 5.2-7 12-7-12z"/><path d="M5 8.6h14"/>',
        lock: '<rect x="4.4" y="10.4" width="15.2" height="10" rx="2.4"/><path d="M8 10.4V7.6a4 4 0 0 1 8 0v2.8"/>',
        warn: '<path d="M12 3.6l8.4 15.2H3.6z"/><path d="M12 9.4v4.4M12 16.6v.6"/>',
        bolt: '<path d="M13 2.6L4.8 13.4h5.6L11 21.4l8.2-10.8h-5.6z"/>'
    };
    function icon(name, cls) {
        return '<svg class="' + cls + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.bolt) + '</svg>';
    }

    function sparkPath(arr, w, h) {
        var min = Math.min.apply(null, arr), max = Math.max.apply(null, arr);
        var span = (max - min) || 1;
        return arr.map(function (v, i) {
            var x = (i / Math.max(arr.length - 1, 1)) * w;
            var y = 3 + (h - ((v - min) / span) * h);
            return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
        }).join(' ');
    }

    /* ---------- KPI ---------- */
    var KPI_C = [
        { c: '#35D9F2', edge: 'rgba(53,217,242,.34)', glow: 'rgba(53,217,242,.45)' },
        { c: '#9275FF', edge: 'rgba(146,117,255,.34)', glow: 'rgba(146,117,255,.42)' },
        { c: '#FFB45F', edge: 'rgba(255,180,95,.34)', glow: 'rgba(255,180,95,.4)' },
        { c: '#35D399', edge: 'rgba(53,211,153,.32)', glow: 'rgba(53,211,153,.4)' }
    ];

    document.getElementById('retKpi').innerHTML = R.kpis.map(function (k, i) {
        var col = KPI_C[i % KPI_C.length];
        var up = k.change >= 0;
        return '<article class="kpi" style="--c:' + col.c + ';--edge:' + col.edge + ';--glow:' + col.glow + '">' +
            '<span class="kpi-ico" aria-hidden="true">' + icon(k.icon, '') + '</span>' +
            '<div class="kpi-main">' +
                '<span class="kpi-label">' + k.label + '</span>' +
                '<div class="kpi-num">' + k.value.toFixed(1) +
                    '<span class="u">' + k.unit + '</span>' +
                    '<span class="kpi-delta' + (up ? '' : ' is-bad') + '">' +
                        (up ? '▲' : '▼') + ' ' + Math.abs(k.change) + (k.key === 'duration' ? '%' : 'pp') +
                    '</span>' +
                '</div>' +
            '</div>' +
            '<svg class="kpi-spark" viewBox="0 0 74 30" aria-hidden="true" focusable="false">' +
                '<path d="' + sparkPath(k.spark, 72, 22) + '" fill="none" stroke="' + col.c +
                '" stroke-width="1.5" stroke-linejoin="round" opacity=".85"/></svg>' +
        '</article>';
    }).join('');

    /* ---------- 趋势 ---------- */
    var trend = echarts.init(document.getElementById('retTrendChart'), null, { renderer: 'canvas' });
    var currentRange = '30d';

    function trendOption(rows) {
        var days = rows.map(function (r) { return r.timestamp; });
        var interval = rows.length > 40 ? Math.ceil(rows.length / 9) : Math.ceil(rows.length / 6);

        function line(name, key, color) {
            return {
                name: name,
                type: 'line',
                smooth: .35,
                symbol: 'none',
                data: rows.map(function (r) { return r[key]; }),
                lineStyle: { width: 2, color: color, shadowColor: color, shadowBlur: 10 },
                endLabel: {
                    show: true,
                    formatter: '{c}%',
                    color: '#04202B',
                    backgroundColor: color,
                    padding: [2, 5],
                    borderRadius: 4,
                    fontSize: 10,
                    fontFamily: MONO,
                    distance: 6
                }
            };
        }

        return {
            grid: { left: 44, right: 62, top: 34, bottom: 26 },
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(7,13,24,.96)',
                borderColor: 'rgba(90,140,200,.28)',
                borderWidth: 1,
                padding: [8, 11],
                textStyle: { color: '#EAF3FF', fontSize: 11 },
                extraCssText: 'border-radius:8px;box-shadow:0 18px 40px -22px #000;',
                axisPointer: { type: 'line', lineStyle: { color: 'rgba(53,217,242,.4)' } },
                formatter: function (ps) {
                    var head = '<div style="font-family:' + MONO + ';font-size:9.5px;letter-spacing:.1em;color:#637A96;margin-bottom:5px">' + ps[0].axisValue + '</div>';
                    return head + ps.map(function (p) {
                        return '<div style="display:flex;gap:14px;justify-content:space-between"><span>' + p.marker + p.seriesName +
                            '</span><b style="font-family:' + MONO + '">' + p.value + '%</b></div>';
                    }).join('');
                }
            },
            legend: {
                right: 54, top: 2,
                itemWidth: 7, itemHeight: 7, itemGap: 12, icon: 'circle',
                textStyle: { color: '#9EB1CA', fontSize: 10, fontFamily: MONO },
                data: ['次日留存', '7日留存', '30日留存']
            },
            xAxis: {
                type: 'category', boundaryGap: false, data: days,
                axisLine: { lineStyle: { color: 'rgba(90,140,200,.2)' } },
                axisTick: { show: false },
                axisLabel: { color: AXIS, fontSize: 9, fontFamily: MONO, interval: interval }
            },
            yAxis: {
                type: 'value', min: 0, max: 60, splitNumber: 3,
                axisLabel: { color: AXIS, fontSize: 9, fontFamily: MONO, formatter: '{value}%' },
                splitLine: { lineStyle: { color: 'rgba(90,140,200,.09)', type: 'dashed' } }
            },
            series: [
                line('次日留存', 'd1', '#35D9F2'),
                line('7日留存', 'd7', '#9275FF'),
                line('30日留存', 'd30', '#FFB45F')
            ]
        };
    }

    function renderTrend(range) {
        currentRange = range;
        try {
            trend.setOption(trendOption(R.trend(range)), true);
        } catch (e) {
            console.warn('留存趋势渲染失败，已降级为占位状态', e);
            document.getElementById('retTrendChart').innerHTML = '<div class="cohort-period" style="padding:16px">趋势数据暂不可用</div>';
        }
    }

    document.querySelectorAll('#trendSeg button').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#trendSeg button').forEach(function (x) {
                var on = x === b;
                x.classList.toggle('is-on', on);
                x.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            renderTrend(b.dataset.range);
            window.dispatchEvent(new CustomEvent('rangechange', { detail: { range: b.dataset.range } }));
        });
    });

    /* 导航下拉 → 同步趋势 */
    window.addEventListener('rangechange', function (ev) {
        var r = ev.detail && ev.detail.range;
        if (!r || r === currentRange) return;
        document.querySelectorAll('#trendSeg button').forEach(function (x) {
            var on = x.dataset.range === r;
            x.classList.toggle('is-on', on);
            x.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        renderTrend(r);
    });

    /* ---------- cohort 表 ---------- */
    (function renderCohort() {
        var host = document.getElementById('cohortBody');
        var max = 52;
        host.innerHTML = R.cohort.map(function (row) {
            var cells = ['d1', 'd3', 'd7', 'd14', 'd30'].map(function (k) {
                var v = row[k];
                var a = 0.10 + (v / max) * 0.62;
                return '<span class="cohort-cell" style="background:rgba(49,139,255,' + a.toFixed(3) + ')">' + v + '%</span>';
            }).join('');
            return '<div class="cohort-row">' +
                '<span class="cohort-period">' + row.period + '</span>' + cells +
            '</div>';
        }).join('');
    })();

    /* ---------- 分群 ---------- */
    function renderSegments(seg) {
        var rows = R.segments[seg] || R.segments.d1;
        document.getElementById('segRows').innerHTML = rows.map(function (s, i) {
            var up = s.change >= 0;
            return '<div class="seg-row">' +
                '<span class="seg-ico" style="--c:' + s.c + '" aria-hidden="true">' + icon(s.icon, '') + '</span>' +
                '<span class="seg-name">' + s.name + '</span>' +
                '<span class="seg-track"><span class="seg-fill" style="--c:' + s.c + ';width:' + s.rate +
                    '%;animation-delay:' + (i * 0.06).toFixed(2) + 's"></span></span>' +
                '<span class="seg-val">' + s.rate.toFixed(1) + '%' +
                    '<em class="' + (up ? '' : 'is-bad') + '">' + (up ? '▲' : '▼') +
                    Math.abs(s.change).toFixed(1) + '</em></span>' +
            '</div>';
        }).join('');
    }
    document.querySelectorAll('#segSeg button').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('#segSeg button').forEach(function (x) {
                var on = x === b;
                x.classList.toggle('is-on', on);
                x.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            renderSegments(b.dataset.seg);
        });
    });

    /* ---------- 关键因素 ---------- */
    var factor = echarts.init(document.getElementById('factorChart'), null, { renderer: 'canvas' });
    factor.setOption({
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(7,13,24,.96)',
            borderColor: 'rgba(90,140,200,.28)',
            borderWidth: 1,
            textStyle: { color: '#EAF3FF', fontSize: 11 },
            formatter: '{b}：{d}%'
        },
        series: [{
            type: 'pie',
            radius: ['62%', '84%'],
            center: ['50%', '52%'],
            itemStyle: { borderRadius: 4, borderColor: '#070D18', borderWidth: 2 },
            label: {
                show: true,
                position: 'center',
                formatter: '{a|68.7%}\n{b|综合影响度}',
                rich: {
                    a: { fontSize: 17, fontWeight: 600, color: '#EAF3FF', fontFamily: MONO, lineHeight: 20 },
                    b: { fontSize: 9, color: '#637A96', lineHeight: 13 }
                }
            },
            labelLine: { show: false },
            data: R.factors.map(function (f) {
                return { value: f.value, name: f.name, itemStyle: { color: f.c } };
            })
        }]
    });

    document.getElementById('factorList').innerHTML = R.factors.map(function (f) {
        return '<span class="factor-item"><i class="factor-dot" style="--c:' + f.c + '"></i>' +
            '<span>' + f.name + '</span><b class="v">' + f.value.toFixed(1) + '%</b></span>';
    }).join('');

    /* ---------- AI 洞察 ---------- */
    (function renderInsights() {
        var host = document.getElementById('insightWrap');
        var TONE = { high: { c: '#FF6B75', icon: 'warn' }, mid: { c: '#FFB45F', icon: 'bolt' } };
        host.innerHTML = R.insights.map(function (it) {
            var t = TONE[it.tone] || TONE.mid;
            return '<div class="insight">' +
                '<span class="insight-ico" style="--ic:' + t.c + '" aria-hidden="true">' + icon(t.icon, '') + '</span>' +
                '<div><b>' + it.title + '</b>' +
                    '<span>' + it.desc + '</span>' +
                    '<span class="insight-act">建议：' + it.action + '</span>' +
                '</div>' +
            '</div>';
        }).join('') +
        '<button class="insight-cta" type="button" id="insightCta">查看详细策略 <span aria-hidden="true">→</span></button>';

        document.getElementById('insightCta').addEventListener('click', function () {
            /* 没有策略中心页面，不做假跳转，只给明确反馈 */
            this.textContent = '策略中心尚未上线';
            this.disabled = true;
            this.style.opacity = '.6';
            this.style.cursor = 'default';
        });
    })();

    /* ---------- 初始化 ---------- */
    renderTrend('30d');
    renderSegments('d1');
    window.addEventListener('resize', function () { trend.resize(); factor.resize(); });
})();
</script>
</body>
</html>
