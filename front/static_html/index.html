        /* 胶囊和精灵样式 */
        .sprite-container {
            position: absolute;
            top: 0;
            left: 200px;
            z-index: 1000;
            width: 150px;
            height: 150px;
        }
        
        /* 精灵球胶囊样式 */
        .capsule {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            animation: pokeballFloat 2s ease-in-out infinite, pokeballRotate 5s ease-in-out infinite;
        }
        
        /* 精灵球外壳 */
        .pokeball {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(0, 240, 255, 0.8);
        }
        
        /* 环绕光环效果 */
        .pokeball::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, rgba(0, 240, 255, 0.3), transparent);
            animation: ringRotate 3s linear infinite;
            pointer-events: none;
        }
        
        @keyframes ringRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        /* 上半部分（红色） */
        .pokeball-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(135deg, #ff3333, #ff6666);
            overflow: hidden;
        }
        
        /* 下半部分（白色） */
        .pokeball-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            overflow: hidden;
        }
        
        /* 分隔线 */
        .pokeball-separator {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background: #000000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            animation: separatorGlow 2s ease-in-out infinite;
            z-index: 2;
        }
        
        /* 中间按钮 */
        .pokeball-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #c0c0c0;
            border-radius: 50%;
            border: 2px solid #333333;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            z-index: 3;
        }
        
        /* 按钮内环 */
        .button-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 240, 255, 1);
            animation: buttonPulse 2s ease-in-out infinite;
        }
        
        /* 电路纹 */
        .circuit-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* 红色区域电路纹 */
        .red-circuit {
            background: 
                linear-gradient(90deg, transparent 49%, rgba(0, 240, 255, 0.5) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(255, 0, 0, 0.5) 50%, transparent 51%);
            background-size: 15px 15px;
            animation: redCircuitFlow 3s linear infinite;
        }
        
        /* 白色区域电路纹 */
        .white-circuit {
            background: 
                linear-gradient(90deg, transparent 49%, rgba(147, 51, 234, 0.5) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(0, 240, 255, 0.5) 50%, transparent 51%);
            background-size: 15px 15px;
            animation: whiteCircuitFlow 3s linear infinite reverse;
        }
        
        /* Q版精灵剪影 */
        .sprite-silhouette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

                50% 0%, 
                100% 25%, 
                100% 75%, 
                50% 100%, 
                0% 75%, 
                0% 25%
            );

            z-index: 1;
        }
        
        /* 粒子效果 */
        .capsule-particles {
            position: absolute;

            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }
        
        /* 精灵球悬浮动画 */
        @keyframes pokeballFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        
        /* 精灵球旋转动画 */
        @keyframes pokeballRotate {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(15deg);
            }
            75% {
                transform: rotate(-15deg);
            }
        }
        
        /* 红色电路纹流动动画 */
        @keyframes redCircuitFlow {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 30px 30px;
            }
        }
        
        /* 白色电路纹流动动画 */
        @keyframes whiteCircuitFlow {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 30px 30px;
            }
        }
        
        /* 分隔线闪光动画 */
        @keyframes separatorGlow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 0, 0, 1), 0 0 30px rgba(255, 0, 0, 0.8);
            }

        /* 按钮脉冲动画 */
        @keyframes buttonPulse {
            0%, 100% {

            }
            50% {

                transform: translate(-50%, -50%) scale(1.1);

        /* Q版精灵剪影显现动画 */
        @keyframes spriteReveal {
            0%, 85%, 100% {
                opacity: 0;
            }
            90% {
                opacity: 1;
                box-shadow: 0 0 20px rgba(255, 255, 255, 1);
            }
        }
        
        /* 精灵球悬停效果 */
        .capsule:hover {
            transform: scale(1.1) translateY(-5px);

        }
        
        @keyframes pokeballHover {
            0% {
                transform: scale(1) translateY(0px);

            50% {
                transform: scale(1.15) translateY(-8px);

            100% {
                transform: scale(1.1) translateY(-5px);
            }
        }

        // 音效系统
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioContext;
        
        function playSound(frequency, duration, type = 'sine') {
            if (!audioContext) {
                audioContext = new AudioContext();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

            if (!isHatched || fromPage === toPage) return;
            const chain = [
                () => {
                    sprite.classList.add('cinema-break');

                    createDissipationParticles();
                    playSound(680, 0.14, 'sawtooth');

                    createLoadingParticles();
                    playSound(1080, 0.16, 'triangle');

                () => {

                    updateCostume(toPage);
                    sprite.classList.add('cinema-born');
                    stageFx('born');
                    playSound(1480, 0.2, 'sine');
                    speechBubble.textContent = `电影变身：${pageLine(fromPage, toPage)}`;
                    speechBubble.style.opacity = '1';
                    speechBubble.style.transform = 'translateX(-50%) translateY(-10px)';
                    setTimeout(() => {
                        speechBubble.style.opacity = '0';
                        speechBubble.style.transform = 'translateX(-50%) translateY(0)';
                        sprite.classList.remove('cinema-born');
                    }, 1200);
                }
            ];
            let i = 0;
            const run = () => {
                if (i >= chain.length) return;
                chain[i++]();
                requestAnimationFrame(() => setTimeout(run, 260));
            };
            run();
        }

        // 时事热点-玩家行为关联图（桑基图）
        function initHotspotBehaviorChart() {
            var chart = echarts.init(document.getElementById('hotspotBehaviorChart'));
            
            // 生成随机数的辅助函数
            function randomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }
            
            function randomFloat(min, max, decimals = 2) {
                const val = Math.random() * (max - min) + min;
                return parseFloat(val.toFixed(decimals));
            }
            
            // 生成情感分析数据
            function generateSentiment() {
                const positive = randomInt(50, 90);
                const negative = randomInt(5, 30);
                const neutral = 100 - positive - negative;
                return {
                    positive: positive,
                    negative: negative,
                    neutral: Math.max(0, neutral),
                    engagement: randomInt(60, 95),
                    churnCorrelation: randomFloat(0.3, 0.85, 2)
                };
            }
            
            // 热点事件池（固定5个）
            const hotspotEvents = [
                { 
                    name: '世界杯', 
                    riskValue: 0.65, 
                    recallOpportunity: 0.42, 
                    sentiment: { positive: 75, negative: 10, neutral: 15, engagement: 90, churnCorrelation: 0.7 } 
                },
                { 
                    name: 'AI绘画爆火', 
                    riskValue: 0.25, 
                    recallOpportunity: 0.78, 
                    sentiment: { positive: 85, negative: 5, neutral: 10, engagement: 80, churnCorrelation: 0.3 } 
                },
                { 
                    name: '某明星塌房', 
                    riskValue: 0.85, 
                    recallOpportunity: 0.15, 
                    sentiment: { positive: 20, negative: 70, neutral: 10, engagement: 60, churnCorrelation: 0.85 } 
                },
                { 
                    name: '新游戏发布', 
                    riskValue: 0.45, 
                    recallOpportunity: 0.60, 
                    sentiment: { positive: 70, negative: 15, neutral: 15, engagement: 75, churnCorrelation: 0.5 } 
                },
                { 
                    name: '政策更新', 
                    riskValue: 0.70, 
                    recallOpportunity: 0.30, 
                    sentiment: { positive: 40, negative: 40, neutral: 20, engagement: 50, churnCorrelation: 0.75 } 
                }
            ];
            
            // 生成兴趣迁移节点
            const interestMigration = [
                '社交媒体讨论', '游戏内关注', '社区互动', '内容创作',
                '好友邀请', '直播观看', '攻略搜索', '论坛发帖'
            ];
            
            // 生成流失风险节点
            const churnRisks = [
                { name: '短期流失', riskValue: randomFloat(0.6, 0.9) },
                { name: '中期流失', riskValue: randomFloat(0.4, 0.7) },
                { name: '长期流失', riskValue: randomFloat(0.2, 0.5) },
                { name: '高价值流失', riskValue: randomFloat(0.7, 0.95) }
            ];
            
            // 生成召回机会节点
            const recallOpportunities = [
                { name: '限时活动召回', recallOpportunity: randomFloat(0.6, 0.9) },
                { name: '社交关系召回', recallOpportunity: randomFloat(0.5, 0.8) },
                { name: '新内容召回', recallOpportunity: randomFloat(0.55, 0.85) },
                { name: '福利激励召回', recallOpportunity: randomFloat(0.65, 0.95) },
                { name: '情感连接召回', recallOpportunity: randomFloat(0.45, 0.75) }
            ];
            
            // 构建桑基图节点
            const nodes = [];
            
            // 1. 热点事件节点（橙色矩形）
            hotspotEvents.forEach((event, index) => {
                nodes.push({
                    name: event.name,
                    category: 0,
                    itemStyle: {
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 1, y2: 0,
                            colorStops: [
                                { offset: 0, color: '#FF6B35' },
                                { offset: 1, color: '#FFA726' }
                            ]
                        }
                    },
                    riskValue: event.riskValue,
                    recallOpportunity: event.recallOpportunity,
                    sentiment: event.sentiment
                });
            });
            
            // 2. 兴趣迁移节点（蓝色圆角矩形）
            interestMigration.forEach((interest, index) => {
                nodes.push({
                    name: interest,
                    category: 1,
                    itemStyle: {
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 1, y2: 0,
                            colorStops: [
                                { offset: 0, color: '#4FC3F7' },
                                { offset: 1, color: '#29B6F6' }
                            ]
                        }
                    }
                });
            });
            
            // 3. 流失风险节点（红色菱形）
            churnRisks.forEach((risk, index) => {
                nodes.push({
                    name: risk.name,
                    category: 2,
                    itemStyle: {
                        color: '#FF375F',
                        borderColor: '#FF6B6B',
                        borderWidth: 2
                    },
                    riskValue: risk.riskValue,
                    symbol: 'diamond'
                });
            });
            
            // 4. 召回机会节点（绿色六边形）
            recallOpportunities.forEach((recall, index) => {
                nodes.push({
                    name: recall.name,
                    category: 3,
                    itemStyle: {
                        color: '#66BB6A',
                        borderColor: '#81C784',
                        borderWidth: 2
                    },
                    recallOpportunity: recall.recallOpportunity,
                    symbol: 'hexagon'
                });
            });
            
            // 构建桑基图边
            const links = [];
            
            // 热点事件 -> 兴趣迁移（蓝色实线，流量3000-8000）
            hotspotEvents.forEach((event, eventIndex) => {
                const numInterests = randomInt(2, 4);
                for (let i = 0; i < numInterests; i++) {
                    const interestIndex = randomInt(0, interestMigration.length - 1);
                    links.push({
                        source: event.name,
                        target: interestMigration[interestIndex],
                        value: randomInt(3000, 8000),
                        lineStyle: {
                            color: '#4FC3F7',
                            type: 'solid'
                        }
                    });
                }
            });
            
            // 计算每个兴趣迁移节点的总流入流量
            const interestFlowMap = {};
            interestMigration.forEach(interest => {
                interestFlowMap[interest] = links
                    .filter(l => l.target === interest)
                    .reduce((sum, l) => sum + l.value, 0);
            });
            
            // 兴趣迁移 -> 流失风险（红色虚线）
            // 根据每个流失风险节点的riskValue分配流量
            interestMigration.forEach((interest, interestIndex) => {
                const interestFlow = interestFlowMap[interest];
                
                churnRisks.forEach((risk, riskIndex) => {
                    // 根据riskValue比例分配流量
                    const riskRatio = risk.riskValue / churnRisks.reduce((sum, r) => sum + r.riskValue, 0);
                    const churnScale = Math.floor(interestFlow * riskRatio * 0.5);
                    
                    if (churnScale > 500) {
                        links.push({
                            source: interest,
                            target: risk.name,
                            value: churnScale,
                            lineStyle: {
                                color: '#FF375F',
                                type: 'dashed'
                            }
                        });
                    }
                });
            });
            
            // 计算每个流失风险节点的总流入流量
            const riskFlowMap = {};
            churnRisks.forEach(risk => {
                riskFlowMap[risk.name] = links
                    .filter(l => l.target === risk.name)
                    .reduce((sum, l) => sum + l.value, 0);
            });
            
            // 流失风险 -> 召回机会（绿色实线）
            // 根据每个召回机会节点的recallOpportunity分配流量
            churnRisks.forEach((risk, riskIndex) => {
                const riskFlow = riskFlowMap[risk.name];
                
                recallOpportunities.forEach((recall, recallIndex) => {
                    // 根据recallOpportunity比例分配流量
                    const recallRatio = recall.recallOpportunity / recallOpportunities.reduce((sum, r) => sum + r.recallOpportunity, 0);
                    const recallScale = Math.floor(riskFlow * recallRatio * 0.9);
                    
                    if (recallScale > 500) {
                        links.push({
                            source: risk.name,
                            target: recall.name,
                            value: recallScale,
                            lineStyle: {
                                color: '#66BB6A',
                                type: 'solid'
                            }
                        });
                    }
                });
            });
            
            // 兴趣迁移 -> 召回机会（30%概率，绿色实线）
            interestMigration.forEach((interest, interestIndex) => {
                if (Math.random() < 0.3) {
                    const interestFlow = interestFlowMap[interest];
                    const recallIndex = randomInt(0, recallOpportunities.length - 1);
                    const recall = recallOpportunities[recallIndex];
                    
                    // 根据recallOpportunity比例分配流量
                    const recallRatio = recall.recallOpportunity / recallOpportunities.reduce((sum, r) => sum + r.recallOpportunity, 0);
                    const directRecallScale = Math.floor(interestFlow * recallRatio * 0.3);
                    
                    if (directRecallScale > 500) {

        // 兴趣迁移路径网络图（D3.js力导向图）
        function initInterestMigrationChart() {
            const container = document.getElementById('interestMigrationChart');
            if (!container || typeof d3 === 'undefined') return;
            d3.select(container).selectAll('*').remove();
            if (container.__interestMigrationUpdateTimer) {
                clearInterval(container.__interestMigrationUpdateTimer);
            }

            let width = container.clientWidth;
            let height = container.clientHeight;

            const baseData = {
                nodes: [
                    { id: 'ip-1', type: 'hot_ip', name: '黑神话：悟空', size: 8600, trend: '↑12%' },
                    { id: 'ip-2', type: 'hot_ip', name: '电竞总决赛', size: 7200, trend: '↑8%' },
                    { id: 'ip-3', type: 'hot_ip', name: '开放世界热游', size: 6900, trend: '↑5%' },
                    { id: 'churn-1', type: 'churn', name: '核心玩家流失', size: 3100, trend: '↑4%' },
                    { id: 'churn-2', type: 'churn', name: '休闲玩家流失', size: 2600, trend: '↓2%' },
                    { id: 'recall-1', type: 'recall', name: 'IP联动限时活动', size: 1900, trend: '↑15%' },
                    { id: 'recall-2', type: 'recall', name: '社群挑战赛', size: 1450, trend: '↑9%' },
                    { id: 'recall-3', type: 'recall', name: '福利礼包召回', size: 1280, trend: '↑6%' }
                ],
                links: [
                    { source: 'ip-1', target: 'churn-1', value: 1380, type: 'hot_to_churn' },
                    { source: 'ip-2', target: 'churn-1', value: 980, type: 'hot_to_churn' },
                    { source: 'ip-3', target: 'churn-2', value: 840, type: 'hot_to_churn' },
                    { source: 'ip-1', target: 'churn-2', value: 760, type: 'hot_to_churn' },
                    { source: 'churn-1', target: 'recall-1', value: 0, type: 'churn_to_recall', recallCount: 1320, churnBase: 3100 },
                    { source: 'churn-1', target: 'recall-2', value: 0, type: 'churn_to_recall', recallCount: 860, churnBase: 3100 },
                    { source: 'churn-2', target: 'recall-2', value: 0, type: 'churn_to_recall', recallCount: 730, churnBase: 2600 },
                    { source: 'churn-2', target: 'recall-3', value: 0, type: 'churn_to_recall', recallCount: 610, churnBase: 2600 }
                ]
            };

            const nodes = baseData.nodes.map(d => ({ ...d }));
            const links = baseData.links.map(d => ({ ...d }));

            const sizeScale = d3.scaleSqrt().domain([600, 9000]).range([10, 28]);
            const churnWidthScale = d3.scaleLinear().domain([400, 1600]).range([1.8, 7.5]);
            const hexagonPath = (r) => {
                const a = Math.PI / 3;
                const pts = d3.range(6).map(i => [Math.cos(a * i - Math.PI / 2) * r, Math.sin(a * i - Math.PI / 2) * r]);
                return `M${pts.map(p => `${p[0]},${p[1]}`).join('L')}Z`;
            };

            const svg = d3.select(container)
                .append('svg')
                .attr('width', width)
                .attr('height', height)
                .style('overflow', 'visible');

            const defs = svg.append('defs');
            defs.append('radialGradient').attr('id', 'nodeHotGrad')
                .selectAll('stop')
                .data([{ o: '0%', c: '#cf8cff' }, { o: '100%', c: '#7a2cff' }])
                .enter().append('stop')
                .attr('offset', d => d.o)
                .attr('stop-color', d => d.c);

            defs.append('linearGradient').attr('id', 'nodeRecallGrad').attr('x1', '0%').attr('x2', '100%')
                .selectAll('stop')
                .data([{ o: '0%', c: '#2f87ff' }, { o: '100%', c: '#67d2ff' }])
                .enter().append('stop')
                .attr('offset', d => d.o)
                .attr('stop-color', d => d.c);

            defs.append('linearGradient').attr('id', 'linkRecallGrad').attr('x1', '0%').attr('x2', '100%')
                .selectAll('stop')
                .data([{ o: '0%', c: '#2f87ff' }, { o: '100%', c: '#7be1ff' }])
                .enter().append('stop')
                .attr('offset', d => d.o)
                .attr('stop-color', d => d.c);

            defs.append('marker')
                .attr('id', 'arrowHot')
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 16)
                .attr('refY', 0)
                .attr('markerWidth', 5)
                .attr('markerHeight', 5)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('fill', 'rgba(255,77,109,0.85)');

            defs.append('marker')
                .attr('id', 'arrowRecall')
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 16)
                .attr('refY', 0)
                .attr('markerWidth', 5)
                .attr('markerHeight', 5)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('fill', '#4fb6ff');

            const nodeGlow = 'drop-shadow(0 0 6px rgba(79,182,255,0.7))';

            const linkLayer = svg.append('g');
            const nodeLayer = svg.append('g');
            const labelLayer = svg.append('g');
            const tooltip = d3.select(container)
                .append('div')
                .style('position', 'absolute')
                .style('z-index', '12')
                .style('min-width', '130px')
                .style('padding', '6px 8px')
                .style('font-size', '10px')
                .style('line-height', '1.5')
                .style('color', '#eaf7ff')
                .style('border', '1px solid rgba(70,180,255,0.6)')
                .style('border-radius', '6px')
                .style('background', 'rgba(8,18,32,0.95)')
                .style('box-shadow', '0 0 12px rgba(0,160,255,0.35)')
                .style('pointer-events', 'none')
                .style('opacity', 0);

            function computeMetrics() {
                links.forEach(l => {
                    if (l.type === 'churn_to_recall') {
                        const efficiency = (l.recallCount / Math.max(l.churnBase, 1)) * 10;
                        l.value = efficiency * 0.8;
                        l.efficiency = efficiency;
                    } else {
                        l.efficiency = null;
                    }
                });
            }
            computeMetrics();

            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(150))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => sizeScale(d.size) + 10));

            const link = linkLayer.selectAll('line')
                .data(links, d => `${d.source.id || d.source}->${d.target.id || d.target}`)
                .enter()
                .append('line')
                .attr('stroke', d => d.type === 'hot_to_churn' ? 'rgba(255,77,109,0.9)' : 'url(#linkRecallGrad)')
                .attr('stroke-opacity', d => d.type === 'hot_to_churn' ? 0.7 : 0.9)
                .attr('stroke-dasharray', d => d.type === 'hot_to_churn' ? '7,5' : null)
                .attr('marker-end', d => d.type === 'hot_to_churn' ? 'url(#arrowHot)' : 'url(#arrowRecall)')
                .attr('stroke-width', d => d.type === 'hot_to_churn' ? churnWidthScale(d.value) : Math.max(1.6, d.value));

            const node = nodeLayer.selectAll('path')
                .data(nodes, d => d.id)
                .enter()
                .append('path')
                .attr('d', d => {
                    const r = sizeScale(d.size);
                    if (d.type === 'hot_ip') return d3.symbol().type(d3.symbolCircle).size(Math.PI * r * r)();
                    if (d.type === 'churn') return d3.symbol().type(d3.symbolDiamond).size(Math.PI * r * r)();
                    return hexagonPath(r);
                })
                .attr('fill', d => d.type === 'hot_ip' ? 'url(#nodeHotGrad)' : (d.type === 'churn' ? '#ff4d6d' : 'url(#nodeRecallGrad)'))
                .attr('stroke', d => d.type === 'churn' ? '#ff92a7' : '#8fd9ff')
                .attr('stroke-width', 1.4)
                .style('filter', nodeGlow)
                .style('cursor', 'pointer')
                .style('opacity', 0)
                .attr('transform', d => `translate(${d.x || width / 2},${d.y || height / 2}) scale(0.1)`)
                .call(
                    d3.drag()
                        .on('start', dragstarted)
                        .on('drag', dragged)
                        .on('end', dragended)
                );

            node.transition()
                .duration(900)
                .ease(d3.easeElasticOut.amplitude(1.2).period(0.4))
                .style('opacity', 1)
                .attrTween('transform', function(d) {
                    const ix = d3.interpolateNumber(width / 2, d.x || width / 2);
                    const iy = d3.interpolateNumber(height / 2, d.y || height / 2);
                    const is = d3.interpolateNumber(0.1, 1);
                    return t => `translate(${ix(t)},${iy(t)}) scale(${is(t)})`;
                });

            const label = labelLayer.selectAll('text')
                .data(nodes, d => d.id)
                .enter().append('text')
                .attr('font-size', '9px')
                .attr('font-weight', 600)
                .attr('fill', '#d7f3ff')
                .attr('text-anchor', 'middle')
                .attr('dy', 3)
                .style('pointer-events', 'none')
                .text(d => d.name);

            function relatedLinkIds(nodeDatum) {
                return new Set(
                    links
                        .filter(l => (l.source.id || l.source) === nodeDatum.id || (l.target.id || l.target) === nodeDatum.id)
                        .map(l => `${l.source.id || l.source}->${l.target.id || l.target}`)
                );
            }

            node.on('mouseenter', function(event, d) {
                const ids = relatedLinkIds(d);
                link.attr('stroke-opacity', l => ids.has(`${l.source.id || l.source}->${l.target.id || l.target}`) ? 1 : 0.12);
                node.attr('opacity', n => n.id === d.id ? 1 : 0.3);
                label.attr('opacity', n => n.id === d.id ? 1 : 0.35);

                tooltip.style('opacity', 1).html(
                    `<div style="font-weight:700;color:#86e6ff;">${d.name}</div>` +
                    `<div>规模: ${Math.round(d.size)} 人</div>` +
                    `<div>趋势: ${d.trend}</div>`
                );
            }).on('mousemove', function(event) {
                const [mx, my] = d3.pointer(event, container);
                tooltip.style('left', `${mx + 14}px`).style('top', `${my + 8}px`);
            }).on('mouseleave', function() {
                link.attr('stroke-opacity', d => d.type === 'hot_to_churn' ? 0.7 : 0.9);
                node.attr('opacity', 1);
                label.attr('opacity', 1);
                tooltip.style('opacity', 0);
            }).on('click', function(event, d) {
                const detail = d.type === 'churn'
                    ? `${d.name} 社群流失条形图（下钻）`
                    : `${d.name} 活动详情（下钻）`;
                window.dispatchEvent(new CustomEvent('interest-migration-drilldown', { detail: { node: d, view: detail } }));
            });

            function ticked() {
                const t = Date.now() / 3000;
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node.attr('transform', d => {
                    const r = sizeScale(d.size);
                    d.x = Math.max(r, Math.min(width - r, d.x));
                    d.y = Math.max(r, Math.min(height - r, d.y));
                    const floatY = Math.sin(t + d.index) * 2;
                    return `translate(${d.x},${d.y + floatY})`;
                });

                label
                    .attr('x', d => d.x)
                    .attr('y', d => d.y + sizeScale(d.size) + 12);
            }
            simulation.on('tick', ticked);

            function updateData() {
                nodes.forEach(n => {
                    const jitter = n.type === 'hot_ip' ? 680 : (n.type === 'churn' ? 380 : 260);
                    n.size = Math.max(500, n.size + (Math.random() - 0.5) * jitter);
                    const trendNum = Math.max(-9, Math.min(18, Math.round((Math.random() - 0.2) * 16)));
                    n.trend = `${trendNum >= 0 ? '↑' : '↓'}${Math.abs(trendNum)}%`;
                });

                links.forEach(l => {
                    if (l.type === 'hot_to_churn') {
                        l.value = Math.max(320, l.value + (Math.random() - 0.45) * 260);
                    } else {
                        l.recallCount = Math.max(300, l.recallCount + (Math.random() - 0.45) * 180);
                        const churnNode = nodes.find(n => n.id === (l.source.id || l.source));
                        l.churnBase = churnNode ? churnNode.size : l.churnBase;
                    }
                });
                computeMetrics();

                node.transition().duration(800).ease(d3.easeCubicInOut)
                    .attr('d', d => {
                        const r = sizeScale(d.size);
                        if (d.type === 'hot_ip') return d3.symbol().type(d3.symbolCircle).size(Math.PI * r * r)();
                        if (d.type === 'churn') return d3.symbol().type(d3.symbolDiamond).size(Math.PI * r * r)();
                        return hexagonPath(r);
                    });

                link.transition().duration(800).ease(d3.easeCubicInOut)
                    .attr('stroke-width', d => d.type === 'hot_to_churn' ? churnWidthScale(d.value) : Math.max(1.6, d.value));

                simulation.force('collision', d3.forceCollide().radius(d => sizeScale(d.size) + 10));
                simulation.alpha(0.45).restart();
            }

            container.__interestMigrationUpdateTimer = setInterval(updateData, 5000);

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            if (container.__interestMigrationResizeHandler) {
                window.removeEventListener('resize', container.__interestMigrationResizeHandler);
            }
            const onResize = () => {
                width = container.clientWidth;
                height = container.clientHeight;
                svg.attr('width', width).attr('height', height);
                simulation.force('center', d3.forceCenter(width / 2, height / 2)).alpha(0.3).restart();
            };
            container.__interestMigrationResizeHandler = onResize;
            window.addEventListener('resize', onResize);
        }

        // 玩家画像雷达图（全球vs中国玩家特征对比）
        function initPlayerProfileChart() {
            const container = document.getElementById('playerProfileChart');
            if (!container) return;
            container.style.height = '100%';

            const chart = echarts.init(container);
            const dimensionOrder = [
                '社交活跃度',
                'UGC参与度',
                '游戏社区互动活跃度',
                '游戏多样性偏好',
                '本土文化关联度',
                '成就活跃度'
            ];
            const rawIndicators = playerComparisonData.radar_data.indicators || [];
            const displayIndicators = rawIndicators.map((item, idx) => ({
                name: dimensionOrder[idx] || item.name,
                max: item.max || 100
            }));
            const scoreMap = {
                china: playerComparisonData.radar_data.china_scores || [83, 83, 83, 83, 5, 78],
                global: playerComparisonData.radar_data.global_scores || [76, 44, 57, 44, 10, 83]
            };

            let selectedDimension = null;
            const radarCenter = ['50%', '54%'];
            const radarRadiusPercent = 0.60;

            function buildGlowGraphics(dimension) {
                const idx = dimensionOrder.indexOf(dimension);
                if (idx < 0) return [];

                const w = container.clientWidth;
                const h = container.clientHeight;
                const cx = w * 0.5;
                const cy = h * 0.54;
                const radarRadius = Math.min(w, h) * 0.5 * radarRadiusPercent;
                const angle = (-Math.PI / 2) + (idx * Math.PI * 2 / dimensionOrder.length);
                const maxValue = (displayIndicators[idx] && displayIndicators[idx].max) || 100;

                function pointByValue(val) {
                    const ratio = Math.max(0, Math.min(1, val / maxValue));
                    return {
                        x: cx + Math.cos(angle) * radarRadius * ratio,
                        y: cy + Math.sin(angle) * radarRadius * ratio
                    };
                }

                const cPoint = pointByValue(scoreMap.china[idx]);
                const gPoint = pointByValue(scoreMap.global[idx]);

                return [
                    { type: 'circle', shape: { cx: cPoint.x, cy: cPoint.y, r: 10 }, style: { fill: 'rgba(74,144,226,0.18)', shadowBlur: 24, shadowColor: '#4A90E2' }, silent: true, z: 99 },
                    { type: 'circle', shape: { cx: cPoint.x, cy: cPoint.y, r: 4 }, style: { fill: '#7fd4ff', shadowBlur: 12, shadowColor: '#4A90E2' }, silent: true, z: 100 },
                    { type: 'circle', shape: { cx: gPoint.x, cy: gPoint.y, r: 10 }, style: { fill: 'rgba(255,107,139,0.18)', shadowBlur: 24, shadowColor: '#FF6B8B' }, silent: true, z: 99 },
                    { type: 'circle', shape: { cx: gPoint.x, cy: gPoint.y, r: 4 }, style: { fill: '#ffc1cf', shadowBlur: 12, shadowColor: '#FF6B8B' }, silent: true, z: 100 }
                ];
            }

            function renderRadar(dimension) {
                const option = {
                    tooltip: {},
                    legend: {
                        data: ['中国玩家', '全球玩家'],
                        textStyle: {
                            color: '#ffffff'
                        }
                    },
                    radar: {
                        indicator: displayIndicators,
                        shape: 'circle',
                        splitNumber: 5,
                        radius: '60%',
                        center: radarCenter,
                        axisName: {
                            formatter: function(name) {
                                return name === dimension ? `{active|${name}}` : `{normal|${name}}`;
                            },
                            rich: {
                                normal: { color: '#ffffff', fontSize: 10 },
                                active: {
                                    color: '#00f0ff',
                                    fontSize: 11,
                                    fontWeight: 700,
                                    textShadowColor: 'rgba(0,240,255,0.9)',
                                    textShadowBlur: 8
                                }
                            }
                        },
                        splitLine: {
                            lineStyle: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        splitArea: {
                            show: true,
                            areaStyle: {
                                color: ['rgba(74, 144, 226, 0.1)', 'rgba(74, 144, 226, 0.2)']
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: function(v) {
                                    return v.value === dimension ? 'rgba(0, 240, 255, 0.95)' : 'rgba(255, 255, 255, 0.3)';
                                },
                                width: function(v) {
                                    return v.value === dimension ? 2 : 1;
                                }
                            }
                        }
                    },
                    graphic: buildGlowGraphics(dimension),
                    series: [
                        {
                            name: '玩家对比',
                            type: 'radar',
                            symbol: 'circle',
                            symbolSize: 6,
                            data: [
                                {
                                    value: scoreMap.china,
                                    name: '中国玩家',
                                    areaStyle: {
                                        color: 'rgba(74, 144, 226, 0.3)'
                                    },
                                    lineStyle: {
                                        color: '#4A90E2',
                                        width: dimension ? 2.5 : 2
                                    },
                                    itemStyle: {
                                        color: '#4A90E2',
                                        shadowBlur: dimension ? 8 : 0,
                                        shadowColor: '#4A90E2'
                                    }
                                },
                                {
                                    value: scoreMap.global,
                                    name: '全球玩家',
                                    areaStyle: {
                                        color: 'rgba(255, 107, 139, 0.3)'
                                    },
                                    lineStyle: {

            chart.on('click', function(params) {
                if (params.componentType === 'radarAxisName' && params.name) {

        }
        
        // 流失风险预测
        function predictRisk() {
            const onlineTime = parseFloat(document.getElementById('onlineTime').value);
            const payment = parseFloat(document.getElementById('payment').value);
            const emotion = parseFloat(document.getElementById('emotion').value);
            
            if (isNaN(onlineTime) || isNaN(payment) || isNaN(emotion)) {
                document.getElementById('riskResult').innerHTML = '<p style="color: #ff3366;">请填写所有字段</p>';
                return;
            }
            
            // 简单的风险预测算法
            let riskScore = 0;
            if (onlineTime < 2) riskScore += 40;
            else if (onlineTime < 5) riskScore += 20;
            
            if (payment < 100) riskScore += 30;
            
            if (emotion < -0.5) riskScore += 40;
            else if (emotion < 0) riskScore += 20;
            
            let riskLevel = '低风险';
            let suggestion = '保持当前状态，继续享受游戏';
            
            if (riskScore > 70) {
                riskLevel = '高风险';
                suggestion = '建议推送专属回忆副本，AI陪伴组队通关';
            } else if (riskScore > 40) {
                riskLevel = '中风险';
                suggestion = '建议推送个性化福利，增强游戏体验';
            }
            
            document.getElementById('riskResult').innerHTML = `
                <p><strong>风险等级：</strong><span style="color: ${riskScore > 70 ? '#ff3366' : riskScore > 40 ? '#ff7d00' : '#00ff9d'}">${riskLevel}</span></p>
                <p><strong>建议：</strong>${suggestion}</p>
            `;
        }
        
        // AI对话模拟
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message) {
                // 添加用户消息
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.innerHTML += `
                    <div class="chat-message user-message">
                        <p>${message}</p>
                    </div>
                `;
                
                // 清空输入框
                input.value = '';
                
                // 滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // 模拟AI回复
                setTimeout(() => {
                    let reply = '';
                    if (message.includes('副本') && message.includes('打不过')) {
                        reply = '记得上次我们一起通关隐藏关吗？我陪你再试一次，这次我们换个策略，先清小怪再打BOSS。';
                    } else if (message.includes('孤独') || message.includes('没人')) {
                        reply = '别担心，我会一直陪你玩，我们可以一起组队完成任务，还可以邀请你的好友一起加入。';
                    } else if (message.includes('无聊')) {
                        reply = '最近游戏更新了新内容，我们可以一起探索新地图，还有限时活动可以参加哦！';
                    } else {
                        reply = '谢谢你的分享！我会一直陪伴你，有什么需要帮助的随时告诉我。';
                    }
                    
                    chatContainer.innerHTML += `
                        <div class="chat-message ai-message">
                            <p>${reply}</p>
                        </div>
                    `;
                    
                    // 滚动到底部
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, 1000);
            }
        }
